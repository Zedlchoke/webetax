<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ETAX Hồ Chí Minh - Đối tác chiến lược tin cậy cho doanh nghiệp Việt Nam và FDI từ nhỏ đến lớn. Dịch vụ tư vấn pháp lý, thuế, kế toán, thành lập công ty, M&A và quản lý dự án tại Việt Nam.">
    <title>ETAX Hồ Chí Minh | Tư vấn Đầu tư Nước Ngoài &amp; Dịch vụ Doanh nghiệp FDI</title>
    
    <!-- Favicon -->
    <link rel="icon" href="/assets/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/favicon-64.png">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js for reactivity (modals, dropdowns, forms) -->
    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap');
        
        :root {
            --navy: #0f172a;
            --navy-light: #1e3a5f;
            --gold: #d4af37;
            --gold-light: #f0d78c;
        }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .heading-serif {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
        }

        .section-header {
            position: relative;
            display: inline-block;
        }
        
        .section-header:after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(to right, #d4af37, #f0d78c);
            border-radius: 3px;
        }

        .nav-active {
            color: #d4af37;
            font-weight: 600;
        }

        .service-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #f0d78c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navy-bg {
            background-color: #0f172a;
        }

        .modal {
            animation: modalPopIn 0.2s ease-out forwards;
        }

        @keyframes modalPopIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .language-option {
            transition: all 0.1s ease;
        }
        
        .language-option:hover {
            background-color: #f8fafc;
        }

        .prose-custom h4 {
            color: #0f172a;
            font-weight: 600;
        }
        
        .prose-custom ul {
            margin-top: 0.5rem;
        }

        .stat-number {
            font-variant-numeric: tabular-nums;
        }

        .sticky-header {
            backdrop-filter: blur(12px);
            background-color: rgba(255,255,255,0.95);
        }

        .page-transition {
            animation: fadeInUp 0.4s ease forwards;
        }

        .flag {
            font-size: 1.1rem;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800" x-data="etaxApp()">
    <!-- HEADER / NAV -->
    <header class="sticky top-0 z-50 border-b border-slate-200 sticky-header">
        <div class="max-w-screen-2xl mx-auto">
            <div class="px-6 lg:px-10 py-4 flex items-center justify-between">
                <!-- Logo -->
                <div class="flex items-center gap-x-3 cursor-pointer" @click="navigateTo('home')">
                    <img src="/assets/logo.png" :alt="t('common.logo_alt')" class="h-12 w-auto object-contain">
                    <div>
                        <div class="font-semibold text-[15px] tracking-tight text-slate-900" x-text="t('common.logo_wordmark')"></div>
                        <div class="text-[10px] text-slate-500 -mt-1 font-medium" x-text="t('common.logo_region')"></div>
                    </div>
                </div>

                <!-- Desktop Navigation -->
                <nav class="hidden md:flex items-center gap-x-8 text-sm font-medium">
                    <a href="#" @click.prevent="navigateTo('home')" 
                       class="hover:text-[#d4af37] transition-colors" 
                       :class="{ 'nav-active': currentPage === 'home' }" x-text="t('nav.home')"></a>
                    <a href="#" @click.prevent="navigateTo('about')" 
                       class="hover:text-[#d4af37] transition-colors"
                       :class="{ 'nav-active': currentPage === 'about' }" x-text="t('nav.about')"></a>
                    <a href="#" @click.prevent="navigateTo('services')" 
                       class="hover:text-[#d4af37] transition-colors"
                       :class="{ 'nav-active': currentPage === 'services' }" x-text="t('nav.services')"></a>
                    <a href="#" @click.prevent="navigateTo('careers')" 
                       class="hover:text-[#d4af37] transition-colors"
                       :class="{ 'nav-active': currentPage === 'careers' }" x-text="t('nav.careers')"></a>
                    <a href="#" @click.prevent="navigateTo('contact')" 
                       class="hover:text-[#d4af37] transition-colors"
                       :class="{ 'nav-active': currentPage === 'contact' }" x-text="t('nav.contact')"></a>
                </nav>

                <!-- Right side controls -->
                <div class="flex items-center gap-x-3">
                    <!-- Language Switcher -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" 
                                class="flex items-center gap-x-2 px-3.5 py-2 rounded-xl border border-slate-200 hover:bg-white transition-all text-sm font-medium bg-white shadow-sm">
                            <span class="flag" x-text="getCurrentFlag()"></span>
                            <span class="font-semibold text-slate-700" x-text="getCurrentLangName()"></span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        
                        <!-- Dropdown -->
                        <div x-show="open" @click.away="open = false"
                             class="absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-1 z-50 text-sm"
                             x-transition:enter="transition ease-out duration-200"
                             x-transition:enter-start="opacity-0 scale-95"
                             x-transition:enter-end="opacity-100 scale-100">
                            
                            <template x-for="lang in languages" :key="lang.code">
                                <button @click="switchLanguage(lang.code); open = false"
                                        class="language-option w-full flex items-center gap-x-3 px-4 py-2.5 text-left hover:bg-slate-50"
                                        :class="{ 'bg-amber-50 text-amber-700 font-semibold': currentLocale === lang.code }">
                                    <span class="flag text-lg" x-text="lang.flag"></span>
                                    <span x-text="lang.name"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- CTA Button -->
                    <button @click="navigateTo('contact')"
                            class="hidden sm:flex items-center gap-x-2 bg-[#0f172a] hover:bg-slate-900 transition-all text-white text-sm font-semibold px-6 py-2.5 rounded-2xl shadow-lg shadow-slate-900/20 active:scale-[0.985]">
                        <span x-text="t('nav.consult_now')"></span>
                    </button>

                    <!-- Mobile Menu Button -->
                    <button @click="mobileMenuOpen = !mobileMenuOpen" 
                            class="md:hidden p-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div x-show="mobileMenuOpen" @click.away="mobileMenuOpen = false"
             class="md:hidden border-t border-slate-100 bg-white px-6 py-4 text-sm font-medium">
            <div class="flex flex-col gap-y-1">
                <a href="#" @click.prevent="navigateTo('home'); mobileMenuOpen=false" class="py-3 px-4 rounded-xl hover:bg-slate-50" x-text="t('nav.home')"></a>
                <a href="#" @click.prevent="navigateTo('about'); mobileMenuOpen=false" class="py-3 px-4 rounded-xl hover:bg-slate-50" x-text="t('nav.about')"></a>
                <a href="#" @click.prevent="navigateTo('services'); mobileMenuOpen=false" class="py-3 px-4 rounded-xl hover:bg-slate-50" x-text="t('nav.services')"></a>
                <a href="#" @click.prevent="navigateTo('careers'); mobileMenuOpen=false" class="py-3 px-4 rounded-xl hover:bg-slate-50" x-text="t('nav.careers')"></a>
                <a href="#" @click.prevent="navigateTo('contact'); mobileMenuOpen=false" class="py-3 px-4 rounded-xl hover:bg-slate-50" x-text="t('nav.contact')"></a>
                
                <div class="pt-3 border-t mt-2">
                    <button @click="navigateTo('contact'); mobileMenuOpen=false"
                            class="w-full flex justify-center items-center gap-x-2 bg-[#0f172a] text-white py-3 rounded-2xl font-semibold text-sm">
                        <span x-text="t('nav.consult_now')"></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main id="page-content" class="min-h-[calc(100vh-140px)]">
        <!-- Content is dynamically rendered by JS / Alpine -->
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#0f172a] text-slate-300 pt-14 pb-8">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-10">
            <!-- 
                CẬP NHẬT MỚI: 
                Dùng Flex + justify-between để đẩy 2 khối sát 2 mép trái - phải.
                Phần Liên kết nhanh sẽ nằm sát mép phải nhất có thể.
            -->
            <div class="flex flex-col md:flex-row md:justify-between gap-y-10 md:gap-x-8">
                <!-- Thông tin liên hệ (bên trái) -->
                <div class="text-sm md:max-w-[520px]">
                    <div class="font-semibold text-white mb-4 tracking-wider text-xs uppercase" x-text="t('footer.contact_info')"></div>
                    <div class="font-semibold text-white mb-2" x-text="t('common.legal_name')"></div>
                    <div class="space-y-3 text-slate-400">
                        <div class="flex items-start gap-x-3">
                            <span class="mt-1">📍</span>
                            <span x-text="t('common.address')"></span>
                        </div>
                        <div class="flex items-center gap-x-3">
                            <span>📞</span>
                            <a :href="'tel:' + t('common.hotline')" class="hover:text-white transition-colors" x-text="t('common.hotline')"></a>
                        </div>
                        <div class="flex items-center gap-x-3">
                            <span>✉️</span>
                            <a :href="'mailto:' + t('common.email')" class="hover:text-white transition-colors" x-text="t('common.email')"></a>
                        </div>
                    </div>
                    
                    <div class="mt-6">
                        <button @click="navigateTo('contact')"
                                class="inline-flex items-center gap-x-2 text-sm font-semibold px-5 py-2.5 rounded-2xl border border-white/30 hover:bg-white hover:text-[#0f172a] transition-all active:scale-[0.985]">
                            <span x-text="t('common.footer_consult_button')"></span>
                        </button>
                    </div>
                </div>

                <!-- Liên kết nhanh (bên phải - sát mép) -->
                <div class="text-sm md:text-right">
                    <div class="font-semibold text-white mb-4 tracking-wider text-xs uppercase" x-text="t('footer.quick_links')"></div>
                    <div class="space-y-2.5">
                        <div @click="navigateTo('about')" class="cursor-pointer hover:text-white transition-colors" x-text="t('footer.about_company')"></div>
                        <div @click="navigateTo('services')" class="cursor-pointer hover:text-white transition-colors" x-text="t('footer.services_main')"></div>
                        <div @click="navigateTo('careers')" class="cursor-pointer hover:text-white transition-colors" x-text="t('footer.careers_opportunity')"></div>
                        <div @click="navigateTo('contact')" class="cursor-pointer hover:text-white transition-colors" x-text="t('footer.contact_consult')"></div>
                    </div>
                </div>
            </div>

            <div class="mt-14 pt-8 border-t border-white/10 flex flex-col md:flex-row items-center justify-between text-xs text-slate-500 gap-y-2">
                <div x-text="t('common.footer_rights')"></div>
                <div x-text="t('common.slogan')"></div>
            </div>
        </div>
    </footer>

    <!-- SERVICE DETAIL MODAL -->
    <div x-show="showServiceModal" 
         class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 p-4"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         @click="showServiceModal = false">
        
        <div @click.stop 
             class="modal bg-white w-full max-w-4xl max-h-[92vh] overflow-hidden rounded-3xl shadow-2xl flex flex-col"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-95 translate-y-8"
             x-transition:enter-end="opacity-100 scale-100 translate-y-0">
            
            <!-- Modal Header -->
            <div class="px-8 py-5 border-b flex items-center justify-between bg-slate-50">
                <div>
                    <div class="uppercase tracking-[1.5px] text-xs font-semibold text-amber-600" x-text="t('common.service_badge')"></div>
                    <h3 class="text-2xl font-semibold text-slate-900" x-text="selectedService?.title"></h3>
                </div>
                <button @click="showServiceModal = false" 
                        class="text-slate-400 hover:text-slate-600 p-2 -mr-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M6 18L18 6M6 6h12v12" />
                    </svg>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="p-8 overflow-y-auto flex-1 prose-custom text-[15px] leading-relaxed text-slate-700" 
                 x-html="selectedService?.full_content">
            </div>
            
            <!-- Modal Footer -->
            <div class="px-8 py-5 border-t bg-white flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <button @click="showServiceModal = false; navigateTo('contact')" 
                            class="px-8 py-3 rounded-2xl bg-[#0f172a] text-white text-sm font-semibold flex-1 sm:flex-none" x-text="t('common.modal_contact_now')">
                    </button>
                    
                    <button @click="showServiceModal = false" 
                            class="px-6 py-3 rounded-2xl border text-sm font-medium" x-text="t('common.modal_close')">
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification (ĐÃ SỬA: vị trí cao hơn + transition đầy đủ + cú pháp HTML đúng) -->
    <div x-show="showToast" 
         class="fixed bottom-20 right-6 z-[200] bg-white border border-slate-200 shadow-xl rounded-2xl px-5 py-4 flex items-center gap-x-3 max-w-sm"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="text-emerald-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18" />
            </svg>
        </div>
        <div>
            <div class="font-semibold text-emerald-700" x-text="toastMessage"></div>
        </div>
    </div>

    <script>
        // Tailwind script configuration
        function initializeTailwind() {
            document.documentElement.style.setProperty('--accent-gold', '#d4af37');
            
            const style = document.createElement('style');
            style.innerHTML = `
                .prose-custom { font-size: 15px; line-height: 1.7; }
                .prose-custom h4 { margin-top: 1.25rem; margin-bottom: .5rem; }
                .prose-custom ul { padding-left: 1.25rem; }
                .prose-custom li { margin-bottom: .35rem; }
            `;
            document.head.append(style);
        }

        // Main Alpine Component
        function etaxApp() {
            return {
                // State
                currentLocale: 'en',
                currentPage: 'home',
                translations: {},
                translationsCache: {},
                languages: [
                    { code: 'en', name: 'English' },
                    { code: 'vi', name: 'Tiếng Việt'},
                    { code: 'zh', name: '中文' }
                ],
                
                // UI State
                mobileMenuOpen: false,
                showServiceModal: false,
                selectedService: null,
                showToast: false,
                toastMessage: '',
                
                // Initialize
                async init() {
                    initializeTailwind();
                    
                    // Load initial locale from URL or localStorage
                    this.detectLocaleFromURL();
                    
                    // Load translations for current locale
                    await this.loadTranslations(this.currentLocale);
                    
                    // Render initial page
                    this.renderCurrentPage();
                    
                    // Listen for browser back/forward
                    window.addEventListener('popstate', () => {
                        this.detectLocaleFromURL();
                        this.renderCurrentPage();
                    });
                    
                    // Update document title & meta on init
                    this.updateSEO();
                    
                    // Keyboard escape for modal
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.showServiceModal) {
                            this.showServiceModal = false;
                        }
                    });
                    
                    console.log('%c[ETAX] Professional multilingual static website initialized successfully.', 'color:#64748b');
                },
                
                // Detect locale and page from URL path
                detectLocaleFromURL() {
                    const path = window.location.pathname;
                    const segments = path.split('/').filter(Boolean);
                    
                    let locale = 'en';           // ← Mặc định là English
                    let page = 'home';
                    
                    if (segments.length > 0) {
                        const first = segments[0];
                        
                        if (first === 'vi') {
                            locale = 'vi';
                            if (segments.length > 1) {
                                page = this.mapSlugToPage(segments[1]);
                            }
                        } else if (first === 'zh') {
                            locale = 'zh';
                            if (segments.length > 1) {
                                page = this.mapSlugToPage(segments[1]);
                            }
                        } else {
                            // Mọi trường hợp còn lại (không có prefix hoặc prefix lạ) → English
                            page = this.mapSlugToPage(first);
                        }
                    }
                    
                    this.currentLocale = locale;
                    this.currentPage = page;
                },
                
                mapSlugToPage(slug) {
                    const mapping = {
                        '': 'home',
                        'trang-chu': 'home',
                        'home': 'home',
                        'gioi-thieu': 'about',
                        'about': 'about',
                        'dich-vu': 'services',
                        'services': 'services',
                        'tuyen-dung': 'careers',
                        'careers': 'careers',
                        'lien-he': 'contact',
                        'contact': 'contact'
                    };
                    return mapping[slug] || 'home';
                },
                
                // Get page slug for URL (Vietnamese preferred for this VN company)
                getPageSlug(page) {
                    const reverseMap = {
                        'home': '',
                        'about': 'about',
                        'services': 'services',
                        'careers': 'careers',
                        'contact': 'contact'
                    };
                    return reverseMap[page] || '';
                },
                
                // Update browser URL without reload (ĐÃ VIẾT LẠI - ỔN ĐỊNH HƠN)
                updateURL() {
                    const slug = this.getPageSlug(this.currentPage);
                    
                    // Xây dựng prefix theo ngôn ngữ (English = không có prefix)
                    let newPath = '/';
                    if (this.currentLocale === 'vi') {
                        newPath = '/vi/';
                    } else if (this.currentLocale === 'zh') {
                        newPath = '/zh/';
                    }
                    
                    if (slug) {
                        newPath += slug;
                    }
                    
                    // Giữ nguyên ngôn ngữ khi chuyển trang
                    if (window.location.pathname !== newPath) {
                        history.pushState({ locale: this.currentLocale }, '', newPath);
                    }
                },
                
                // Switch language
                async switchLanguage(newLocale) {
                    if (newLocale === this.currentLocale) return;
                    
                    this.currentLocale = newLocale;
                    
                    // Load new translations if needed
                    await this.loadTranslations(newLocale);
                    
                    // Update URL
                    this.updateURL();
                    
                    // Re-render current page with new language
                    this.renderCurrentPage();
                    this.updateSEO();

                    // Cuộn mượt về đầu trang khi chuyển ngôn ngữ
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },
                
                getCurrentFlag() {
                    const lang = this.languages.find(l => l.code === this.currentLocale);
                    return lang ? lang.flag : '🇻🇳';
                },
                
                getCurrentLangName() {
                    const lang = this.languages.find(l => l.code === this.currentLocale);
                    return lang ? lang.name.split(' ')[0] : 'Tiếng Việt';
                },
                
                // Translation helper
                t(key) {
                    if (!this.translations) return key;
                    
                    const keys = key.split('.');
                    let value = this.translations;
                    
                    for (const k of keys) {
                        if (value && typeof value === 'object' && k in value) {
                            value = value[k];
                        } else {
                            return key; // fallback
                        }
                    }
                    return value || key;
                },
                
                // Load translations (with cache)
                async loadTranslations(locale) {
                    if (this.translationsCache[locale]) {
                        this.translations = this.translationsCache[locale];
                        return;
                    }
                    
                    try {
                        const res = await fetch(`/messages/${locale}.json`);
                        if (!res.ok) throw new Error('Failed to load translations');
                        
                        const data = await res.json();
                        this.translationsCache[locale] = data;
                        this.translations = data;
                    } catch (error) {
                        console.error('Error loading translations:', error);
                        // Fallback to Vietnamese if error
                        if (locale !== 'vi') {
                            await this.loadTranslations('vi');
                        }
                    }
                },
                
                // Render current page
                renderCurrentPage() {
                    const container = document.getElementById('page-content');
                    if (!container) return;

                    let html = '';
                    
                    switch (this.currentPage) {
                        case 'home':
                            html = this.getHomeHTML();
                            break;
                        case 'about':
                            html = this.getAboutHTML();
                            break;
                        case 'services':
                            html = this.getServicesHTML();
                            break;
                        case 'careers':
                            html = this.getCareersHTML();
                            break;
                        case 'contact':
                            html = this.getContactHTML();
                            break;
                        default:
                            html = this.getHomeHTML();
                    }
                    
                    container.innerHTML = html;
                    
                    // Re-attach form listeners after rendering
                    this.attachFormListeners();
                },
                
                attachFormListeners() {
                    // Contact form
                    const contactForm = document.getElementById('contact-form');
                    if (contactForm) {

                    if (careersForm) {

                    const grid = document.getElementById('services-grid');
                    if (!grid) return;

                    // Xóa listener cũ nếu có
                    grid.onclick = null;

                    grid.addEventListener('click', (e) => {

                        if (card && card.dataset.serviceId) {

                // Gửi form Contact qua Web3Forms (ĐÃ CẬP NHẬT: hỗ trợ đa ngôn ngữ + thông báo rõ ràng)
                async handleContactSubmit(form) {
                    const submitBtn = form.querySelector('button[type="submit"]');
                    const originalText = submitBtn.innerHTML;

                    // Đa ngôn ngữ cho nút đang gửi
                    const locale = this.currentLocale;
                    const sendingText = this.t('forms.sending');
                    
                    submitBtn.innerHTML = sendingText;
                    submitBtn.disabled = true;

                    try {
                        const formData = new FormData(form);
                        
                        const response = await fetch('https://api.web3forms.com/submit', {
                            method: 'POST',
                            body: formData
                        });

                        const result = await response.json();

                        if (result.success) {
                            this.showToastMessage(this.t('forms.contact_success'));
                            form.reset();
                        } else {
                            this.showToastMessage(this.t('forms.submit_failed_retry'));
                            console.error('Web3Forms Error:', result);
                        }
                    } catch (error) {
                        this.showToastMessage(this.t('forms.generic_error'));
                        console.error('Network Error:', error);
                    } finally {
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                },

                // Gửi form Careers (có file CV) qua Web3Forms (ĐÃ CẬP NHẬT: hỗ trợ đa ngôn ngữ + thông báo rõ ràng + debug tốt hơn)
                async handleCareersSubmit(form) {
                    const submitBtn = form.querySelector('button[type="submit"]');
                    const originalText = submitBtn.innerHTML;

                    // Đa ngôn ngữ cho nút đang gửi
                    const locale = this.currentLocale;
                    const sendingText = this.t('forms.sending');
                    
                    submitBtn.innerHTML = sendingText;
                    submitBtn.disabled = true;

                    // === KIỂM TRA KÍCH THƯỚC FILE CV TRƯỚC KHI GỬI (TỐI ĐA 8MB) ===
                    const fileInput = form.querySelector('input[type="file"][name="attachment"]');
                    if (fileInput && fileInput.files.length > 0) {
                        const file = fileInput.files[0];
                        const maxSize = 8 * 1024 * 1024; // 8MB

                        if (file.size > maxSize) {
                            this.showToastMessage(this.t('forms.file_too_large'));
                            submitBtn.innerHTML = originalText;
                            submitBtn.disabled = false;
                            return;
                        }
                    }

                    try {
                        const formData = new FormData(form);
                        
                        const response = await fetch('https://api.web3forms.com/submit', {
                            method: 'POST',
                            body: formData
                        });

                        const result = await response.json();

                        if (result.success) {
                            this.showToastMessage(this.t('forms.careers_success'));
                            form.reset();
                        } else {
                            // Hiển thị lỗi chi tiết hơn từ Web3Forms
                            let failMsg = this.t('forms.submit_failed_retry');
                            
                            if (result.message) {
                                failMsg = result.message;
                            }
                            
                            this.showToastMessage(failMsg);
                            
                            // Debug chi tiết hơn
                            console.error('Web3Forms Error (Status 400):', result);
                            console.log('Full response object:', JSON.stringify(result, null, 2));
                        }
                    } catch (error) {
                        this.showToastMessage(this.t('forms.generic_error'));
                        console.error('Network Error:', error);
                    } finally {
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                },
                
                showToastMessage(message) {
                    this.toastMessage = message;
                    this.showToast = true;
                    
                    setTimeout(() => {
                        this.showToast = false;
                    }, 4500);
                },
                
                // CẬP NHẬT SEO (title + meta description) theo ngôn ngữ hiện tại
                // ĐÃ THÊM: Hàm này bị thiếu trước đây → gây lỗi "this.updateSEO is not a function"
                updateSEO() {
                    try {
                        const meta = this.t('meta') || {};
                        if (meta.title) {
                            document.title = meta.title;
                        }
                        const descTag = document.querySelector('meta[name="description"]');
                        if (descTag && meta.description) {
                            descTag.setAttribute('content', meta.description);
                        }
                    } catch (e) {
                        console.warn('[ETAX] SEO update warning:', e);
                    }
                },
                
                // Navigate to page
                navigateTo(page) {
                    this.currentPage = page;
                    this.updateURL();
                    this.renderCurrentPage();
                    
                    // Close mobile menu if open
                    this.mobileMenuOpen = false;

                    // Cuộn mượt về đầu trang khi chuyển trang (áp dụng cho nav, quick links, CTA buttons)
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                openServiceModal(serviceId) {

                                <div class="text-xs tracking-[3px] text-amber-600 font-bold" x-text="t('common.contact_badge')"></div>
                                <h1 class="text-5xl font-semibold tracking-tighter mt-1">${this.t('contact.title')}</h1>
                                <p class="mt-4 text-xl text-slate-600">${this.t('contact.intro')}</p>
                            </div>
                            
                            <div class="grid lg:grid-cols-5 gap-x-8 gap-y-12">
                                <!-- Form -->
                                <div class="lg:col-span-3 bg-white border rounded-3xl p-9">
                                    <h3 class="font-semibold text-2xl tracking-tight mb-7">${this.t('contact.form_title')}</h3>
                                    
                                    <form id="contact-form" class="space-y-6">
                                        <!-- Web3Forms Hidden Fields -->
                                        <input type="hidden" name="access_key" value="c17d7f46-9701-4a9d-8d66-7bb837c83c8b">
                                        <input type="hidden" name="subject" value="${this.t('forms.contact_subject')}">
                                        <input type="hidden" name="from_name" value="${this.t('forms.contact_from_name')}">
                                        <input type="hidden" name="replyto" value="${this.t('common.email')}">
                                        <!-- Honeypot chống spam -->
                                        <input type="checkbox" name="botcheck" class="hidden" style="display:none">

                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-6">
                                            <div>
                                                <label class="block text-xs font-bold tracking-widest text-slate-500 mb-2" x-text="t('contact.form_full_name')"></label>
                                                <input type="text" name="full_name" required class="w-full h-12 border border-slate-200 focus:border-amber-400 px-5 rounded-2xl text-sm">
                                            </div>
                                            <div>
                                                <label class="block text-xs font-bold tracking-widest text-slate-500 mb-2" x-text="t('contact.form_email')"></label>
                                                <input type="email" name="email" required class="w-full h-12 border border-slate-200 focus:border-amber-400 px-5 rounded-2xl text-sm">
                                            </div>
                                        </div>
                                        
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-6">
                                            <div>
                                                <label class="block text-xs font-bold tracking-widest text-slate-500 mb-2" x-text="t('contact.form_phone')"></label>
                                                <input type="tel" name="phone" required class="w-full h-12 border border-slate-200 focus:border-amber-400 px-5 rounded-2xl text-sm">
                                            </div>
                                            <div>
                                                <label class="block text-xs font-bold tracking-widest text-slate-500 mb-2">${this.t('contact.form_service_label')} *</label>
                                                <select name="service" required class="w-full h-12 border border-slate-200 focus:border-amber-400 px-5 rounded-2xl text-sm bg-white">
                                                    ${options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                                                </select>
                                            </div>
                                        </div>
                                        
                                        <div>
                                            <label class="block text-xs font-bold tracking-widest text-slate-500 mb-2" x-text="t('contact.form_message')"></label>
                                            <textarea name="message" rows="5" required placeholder="${this.t('contact.placeholder_message_contact')}" class="w-full border border-slate-200 focus:border-amber-400 px-5 py-4 rounded-3xl text-sm"></textarea>
                                        </div>
                                        
                                        <button type="submit"
                                                class="w-full h-14 bg-[#0f172a] active:bg-black text-white font-semibold rounded-2xl text-sm tracking-[0.5px]" x-text="t('contact.form_submit')">
                                        </button>
                                        
                                        <p class="text-center text-xs text-slate-400" x-text="t('contact.response_commitment')"></p>
                                    </form>
                                </div>
                                
                                <!-- Contact Info + Map -->
                                <div class="lg:col-span-2 space-y-8">
                                    <div class="bg-white border rounded-3xl p-8">
                                        <div class="font-semibold tracking-tight text-xl mb-6">${this.t('contact.info_title')}</div>
                                        <div class="font-semibold text-lg text-[#0f172a] mb-4">${this.t('common.legal_name')}</div>
                                        <div class="space-y-5 text-sm">
                                            <div>
                                                <div class="text-xs text-slate-500" x-text="t('contact.hotline_label')"></div>
                                                <!-- ĐÃ SỬA: Bỏ hardcode số cũ, dùng dynamic + định dạng tel quốc tế -->
                                                <a :href="'tel:' + this.t('common.hotline').replace(/[^0-9+]/g, '')" 
                                                   class="block mt-0.5 text-xl font-semibold text-[#0f172a] hover:text-amber-700">${this.t('common.hotline')}</a>
                                            </div>
                                            
                                            <div>
                                                <div class="text-xs text-slate-500" x-text="t('contact.email_label')"></div>
                                                <a :href="'mailto:' + t('common.email')" 
                                                    class="block mt-0.5 text-lg font-medium hover:text-amber-700 break-all" 
                                                    x-text="t('common.email')"></a>
                                            </div>
                                            
                                            <div>
                                                <div class="text-xs text-slate-500" x-text="t('contact.address_label')"></div>
                                                <div class="mt-0.5 leading-snug">${this.t('common.address')}</div>
                                            </div>
                                            
                                            <div class="pt-3 border-t text-xs text-emerald-600 font-medium">
                                                ${this.t('contact.working_hours')}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Google Map -->
                                    <div>
                                        <div class="text-xs font-bold tracking-wider text-slate-500 mb-3 px-1">${this.t('contact.map_title')}</div>
                                        <div class="aspect-video w-full rounded-3xl overflow-hidden border shadow-inner">
                                            <!-- ĐÃ CẬP NHẬT: Dùng link embed chính thức từ Google Maps (thay vì share link) -->
                                            <iframe 
                                                src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d14165.441850465686!2d106.6997399!3d10.8136457!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x403d9b4ce2038f97%3A0xcf0ceefd87d0ba40!2sC%C3%B4ng%20ty%20TNHH%20Royal%20Vi%E1%BB%87t%20Nam!5e1!3m2!1svi!2s!4v1783570631110!5m2!1svi!2s" 
                                                width="100%" 
                                                height="100%" 
                                                style="border:0;" 
                                                allowfullscreen="" 
                                                loading="lazy"
                                                referrerpolicy="strict-origin-when-cross-origin">
                                            </iframe>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }
        
        // Global navigate helper (ĐÃ VIẾT LẠI - ĐƠN GIẢN VÀ ỔN ĐỊNH HƠN)
        window.goTo = function(page) {
            const alpineEl = document.querySelector('[x-data]');
            if (alpineEl && alpineEl.__x && alpineEl.__x.$data && typeof alpineEl.__x.$data.navigateTo === 'function') {
                alpineEl.__x.$data.navigateTo(page);
            } else {
                // Fallback mới - phù hợp với cấu trúc English làm mặc định
                const path = window.location.pathname;
                let locale = 'en';
                
                if (path.startsWith('/vi')) {
                    locale = 'vi';
                } else if (path.startsWith('/zh')) {
                    locale = 'zh';
                }

                let url = '/';
                
                if (locale === 'vi') {
                    url = '/vi/';
                } else if (locale === 'zh') {
                    url = '/zh/';
                }

                if (page === 'services') {
                    url += 'services';
                } else if (page === 'contact') {
                    url += 'contact';
                } else if (page === 'about') {
                    url += 'about';
                } else if (page === 'careers') {
                    url += 'careers';
                }
                // home thì để url = '/' hoặc '/vi/' hoặc '/zh/'

                window.location.href = url;
            }
        };

// Global helper mở modal dịch vụ (ĐÃ CẢI THIỆN)
        window.openServiceModal = function(serviceId) {
            const alpineEl = document.querySelector('[x-data]');
            if (alpineEl && alpineEl.__x && alpineEl.__x.$data) {
                const data = alpineEl.__x.$data;
                if (typeof data.openServiceModal === 'function') {
                    data.openServiceModal(parseInt(serviceId));
                } else {
                    console.warn('openServiceModal method not found');
                }
            } else {
                console.warn('Alpine instance not found');
            }
        };

        // Boot the application
        document.addEventListener('alpine:init', () => {
            // Alpine is ready
        });
        
        // Start everything when DOM is ready
        window.onload = function() {
            console.log('%c[ETAX HCM] Static multilingual website ready for Cloudflare Pages.', 'color:#64748b; font-size:9px');
        }
    </script>
</body>
</html>
