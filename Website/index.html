    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
        
        :root {
            --navy: #0f172a;
            --navy-light: #1e3a5f;
            --gold: #d4af37;
            --gold-light: #f0d78c;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            letter-spacing: -0.02em;
        }
        
        .credential-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .editorial-card {
            border-radius: 1rem;
            box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .editorial-card:hover {
            border-color: rgba(212, 175, 55, 0.45);
            box-shadow: 0 16px 32px -12px rgb(15 23 42 / 0.12);
        }

        .feature-card {
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #f0d78c);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .feature-card:hover::before {
            opacity: 1;
        }

        .btn-primary {
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -8px rgb(212 175 55 / 0.55);
        }

        .btn-ghost {
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .btn-ghost:hover {
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.65);
        }

        .stats-band {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }

        .stat-item {
            position: relative;
        }

        @media (min-width: 768px) {
            .stat-item:not(:last-child)::after {
                content: '';
                position: absolute;
                right: 0;
                top: 15%;
                height: 70%;
                width: 1px;
                background: linear-gradient(to bottom, transparent, rgba(212, 175, 55, 0.35), transparent);
            }
        }

        .sticky-header {
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.92);
        }

        .sticky-header-scrolled {
            backdrop-filter: blur(16px);
            background-color: rgba(255, 255, 255, 0.97);
        }

        .nav-link {
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #d4af37, #f0d78c);
            border-radius: 2px;
            transition: width 0.25s ease;
        }

        .nav-link:hover::after,
        .nav-link.nav-active::after {
            width: 100%;
        }

        .mobile-cta-bar {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgb(226 232 240 / 0.9);
            box-shadow: 0 -8px 24px -8px rgb(15 23 42 / 0.12);
        }

        .page-hero {
            background-position: center 30%;
        }

        .form-field {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-field:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgb(212 175 55 / 0.12);
        }

        .info-tile {
            transition: border-color 0.25s ease, transform 0.25s ease;
        }

        .info-tile:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .section-header {
            position: relative;
            display: inline-block;
        }
        
        .section-header:after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(to right, #d4af37, #f0d78c);
            border-radius: 3px;
        }

        .nav-active {
            color: #d4af37;
            font-weight: 600;
        }

        .service-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #f0d78c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navy-bg {
            background-color: #0f172a;
        }

        .modal {
            animation: modalPopIn 0.2s ease-out forwards;
        }

        @keyframes modalPopIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .language-option {
            transition: all 0.1s ease;
        }
        
        .language-option:hover {
            background-color: #f8fafc;
        }

        .prose-custom h4 {
            color: #0f172a;
            font-weight: 600;
        }
        
        .prose-custom ul {
            margin-top: 0.5rem;
        }

        .stat-number {
            font-variant-numeric: tabular-nums;
        }

        .page-transition {
            animation: fadeInUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .flag {
            font-size: 1.1rem;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 md:pb-0" x-data="etaxApp()">
    <!-- HEADER / NAV -->
    <header class="sticky top-0 z-50 transition-all duration-300"
            :class="headerScrolled ? 'sticky-header-scrolled border-b border-slate-200/80 shadow-lg shadow-slate-900/5' : 'sticky-header border-b border-slate-200/60'">
        <div class="max-w-7xl mx-auto">
            <div class="px-6 lg:px-10 py-4 flex items-center justify-between">
                <!-- Logo -->
                <div class="flex items-center gap-x-3 cursor-pointer" @click="navigateTo('home')">
                    <img src="/assets/logo.png" :alt="t('common.logo_alt')" class="h-12 w-auto object-contain">
                    <div>
                        <div class="font-semibold text-[15px] tracking-tight text-slate-900" x-text="t('common.logo_wordmark')"></div>
                        <div class="text-[10px] text-slate-500 -mt-1 font-medium" x-text="t('common.logo_region')"></div>
                    </div>
                </div>

                <!-- Desktop Navigation -->
                <nav class="hidden md:flex items-center gap-x-6 text-sm font-medium">
                    <a href="#" @click.prevent="navigateTo('home')" 
                       class="nav-link hover:text-[#d4af37] transition-colors" 
                       :class="{ 'nav-active': currentPage === 'home' }" x-text="t('nav.home')"></a>
                    <a href="#" @click.prevent="navigateTo('about')" 
                       class="nav-link hover:text-[#d4af37] transition-colors"
                       :class="{ 'nav-active': currentPage === 'about' }" x-text="t('nav.about')"></a>
                    <a href="#" @click.prevent="navigateTo('services')" 
                       class="nav-link hover:text-[#d4af37] transition-colors"
                       :class="{ 'nav-active': currentPage === 'services' }" x-text="t('nav.services')"></a>
                    <a href="#" @click.prevent="navigateTo('news')" 
                       class="nav-link hover:text-[#d4af37] transition-colors"
                       :class="{ 'nav-active': currentPage === 'news' }" x-text="t('nav.news')"></a>
                    <a href="#" @click.prevent="navigateTo('careers')" 
                       class="nav-link hover:text-[#d4af37] transition-colors"
                       :class="{ 'nav-active': currentPage === 'careers' }" x-text="t('nav.careers')"></a>
                    <a href="#" @click.prevent="navigateTo('contact')" 
                       class="nav-link hover:text-[#d4af37] transition-colors"
                       :class="{ 'nav-active': currentPage === 'contact' }" x-text="t('nav.contact')"></a>
                </nav>

                <!-- Right side controls -->
                <div class="flex items-center gap-x-3">
                    <!-- Language Switcher -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" 
                                class="flex items-center gap-x-2 px-3.5 py-2 rounded-xl border border-slate-200 hover:bg-white transition-all text-sm font-medium bg-white shadow-sm">
                            <span class="flag" x-text="getCurrentFlag()"></span>
                            <span class="font-semibold text-slate-700" x-text="getCurrentLangName()"></span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        
                        <!-- Dropdown -->
                        <div x-show="open" @click.away="open = false"
                             class="absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-1 z-50 text-sm"
                             x-transition:enter="transition ease-out duration-200"
                             x-transition:enter-start="opacity-0 scale-95"
                             x-transition:enter-end="opacity-100 scale-100">
                            
                            <template x-for="lang in languages" :key="lang.code">
                                <button @click="switchLanguage(lang.code); open = false"
                                        class="language-option w-full flex items-center gap-x-3 px-4 py-2.5 text-left hover:bg-slate-50"
                                        :class="{ 'bg-amber-50 text-amber-700 font-semibold': currentLocale === lang.code }">
                                    <span class="flag text-lg" x-text="lang.flag"></span>
                                    <span x-text="lang.name"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- CTA Button -->
                    <button @click="navigateTo('contact')"
                            class="hidden sm:flex items-center gap-x-2 bg-[#0f172a] hover:bg-slate-900 transition-all text-white text-sm font-semibold px-6 py-2.5 rounded-2xl shadow-lg shadow-slate-900/20 active:scale-[0.985]">
                        <span x-text="t('nav.consult_now')"></span>
                    </button>

                    <!-- Mobile Menu Button -->
                    <button @click="mobileMenuOpen = !mobileMenuOpen" 
                            class="md:hidden p-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div x-show="mobileMenuOpen" @click.away="mobileMenuOpen = false"
             class="md:hidden border-t border-slate-100 bg-white px-6 py-4 text-sm font-medium">
            <div class="flex flex-col gap-y-1">
                <a href="#" @click.prevent="navigateTo('home'); mobileMenuOpen=false" class="py-3 px-4 rounded-xl hover:bg-slate-50" x-text="t('nav.home')"></a>
                <a href="#" @click.prevent="navigateTo('about'); mobileMenuOpen=false" class="py-3 px-4 rounded-xl hover:bg-slate-50" x-text="t('nav.about')"></a>
                <a href="#" @click.prevent="navigateTo('services'); mobileMenuOpen=false" class="py-3 px-4 rounded-xl hover:bg-slate-50" x-text="t('nav.services')"></a>
                <a href="#" @click.prevent="navigateTo('news'); mobileMenuOpen=false" class="py-3 px-4 rounded-xl hover:bg-slate-50" x-text="t('nav.news')"></a>
                <a href="#" @click.prevent="navigateTo('careers'); mobileMenuOpen=false" class="py-3 px-4 rounded-xl hover:bg-slate-50" x-text="t('nav.careers')"></a>
                <a href="#" @click.prevent="navigateTo('contact'); mobileMenuOpen=false" class="py-3 px-4 rounded-xl hover:bg-slate-50" x-text="t('nav.contact')"></a>
                
                <div class="pt-3 border-t mt-2">
                    <button @click="navigateTo('contact'); mobileMenuOpen=false"
                            class="w-full flex justify-center items-center gap-x-2 bg-[#0f172a] text-white py-3 rounded-2xl font-semibold text-sm">
                        <span x-text="t('nav.consult_now')"></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main id="page-content" class="min-h-[calc(100vh-140px)] page-transition">
        <!-- Content is dynamically rendered by JS / Alpine -->
    </main>

    <!-- MOBILE QUICK CTA -->
    <div class="mobile-cta-bar fixed bottom-0 inset-x-0 z-40 md:hidden px-4 py-3">
        <div class="flex gap-2 max-w-lg mx-auto">
            <a :href="'tel:' + t('common.hotline').replace(/[^0-9+]/g, '')"
               class="flex-1 inline-flex items-center justify-center gap-2 h-12 rounded-xl bg-[#0f172a] text-white text-sm font-semibold">
                <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92Z"/></svg>
                <span x-text="t('common.hotline')"></span>
            </a>
            <button @click="navigateTo('contact')"
                    class="flex-1 inline-flex items-center justify-center h-12 rounded-xl bg-[#d4af37] text-[#0f172a] text-sm font-semibold">
                <span x-text="t('nav.consult_now')"></span>
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-[#0f172a] text-slate-300 pt-14 pb-8">
        <div class="max-w-7xl mx-auto px-6 lg:px-10">
            <!-- 
                CẬP NHẬT MỚI: 
                Dùng Flex + justify-between để đẩy 2 khối sát 2 mép trái - phải.
                Phần Liên kết nhanh sẽ nằm sát mép phải nhất có thể.
            -->
            <div class="flex flex-col md:flex-row md:justify-between gap-y-10 md:gap-x-8">
                <!-- Thông tin liên hệ (bên trái) -->
                <div class="text-sm md:max-w-[520px]">
                    <div class="font-semibold text-white mb-4 tracking-wider text-xs uppercase" x-text="t('footer.contact_info')"></div>
                    <div class="font-semibold text-white mb-2" x-text="t('common.legal_name')"></div>
                    <div class="space-y-3 text-slate-400">
                        <div class="flex items-start gap-x-3">
                            <svg class="mt-0.5 h-4 w-4 shrink-0 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
                            <span x-text="t('common.address')"></span>
                        </div>
                        <div class="flex items-center gap-x-3">
                            <svg class="h-4 w-4 shrink-0 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92Z"/></svg>
                            <a :href="'tel:' + t('common.hotline')" class="hover:text-white transition-colors" x-text="t('common.hotline')"></a>
                        </div>
                        <div class="flex items-center gap-x-3">
                            <svg class="h-4 w-4 shrink-0 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                            <a :href="'mailto:' + t('common.email')" class="hover:text-white transition-colors" x-text="t('common.email')"></a>
                        </div>
                    </div>
                    
                    <div class="mt-6">
                        <button @click="navigateTo('contact')"
                                class="inline-flex items-center gap-x-2 text-sm font-semibold px-5 py-2.5 rounded-2xl border border-white/30 hover:bg-white hover:text-[#0f172a] transition-all active:scale-[0.985]">
                            <span x-text="t('common.footer_consult_button')"></span>
                        </button>
                    </div>
                    <div class="mt-8">
                        <div class="font-semibold text-white mb-3 tracking-wider text-xs uppercase" x-text="t('common.follow_us')"></div>
                        <a href="https://www.facebook.com/ETAXHCMVN/" target="_blank" rel="noopener noreferrer"
                           class="inline-flex items-center gap-x-2 text-slate-400 hover:text-white transition-colors">
                            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                            <span x-text="t('common.facebook')"></span>
                        </a>
                    </div>
                </div>

                <!-- Liên kết nhanh (bên phải - sát mép) -->
                <div class="text-sm md:text-right">
                    <div class="font-semibold text-white mb-4 tracking-wider text-xs uppercase" x-text="t('footer.quick_links')"></div>
                    <div class="space-y-2.5">
                        <div @click="navigateTo('about')" class="cursor-pointer hover:text-white transition-colors" x-text="t('footer.about_company')"></div>
                        <div @click="navigateTo('services')" class="cursor-pointer hover:text-white transition-colors" x-text="t('footer.services_main')"></div>
                        <div @click="navigateTo('news')" class="cursor-pointer hover:text-white transition-colors" x-text="t('nav.news')"></div>
                        <div @click="navigateTo('careers')" class="cursor-pointer hover:text-white transition-colors" x-text="t('footer.careers_opportunity')"></div>
                        <div @click="navigateTo('contact')" class="cursor-pointer hover:text-white transition-colors" x-text="t('footer.contact_consult')"></div>
                    </div>
                </div>
            </div>

            <div class="mt-14 pt-8 border-t border-white/10 flex flex-col md:flex-row items-center justify-between text-xs text-slate-500 gap-y-2">
                <div x-text="t('common.footer_rights')"></div>
                <div x-text="t('common.slogan')"></div>
            </div>
        </div>
    </footer>

    <!-- SERVICE DETAIL MODAL -->
    <div x-show="showServiceModal" 
         class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 p-4"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         @click="showServiceModal = false">
        
        <div @click.stop 
             class="modal bg-white w-full max-w-4xl max-h-[92vh] overflow-hidden rounded-2xl shadow-2xl flex flex-col"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-95 translate-y-8"
             x-transition:enter-end="opacity-100 scale-100 translate-y-0">
            
            <!-- Modal Header -->
            <div class="px-8 py-5 border-b flex items-center justify-between bg-slate-50">
                <div>
                    <div class="uppercase tracking-[1.5px] text-xs font-semibold text-amber-600" x-text="t('common.service_badge')"></div>
                    <h3 class="text-2xl font-semibold text-slate-900" x-text="selectedService?.title"></h3>
                </div>
                <button @click="showServiceModal = false" 
                        class="text-slate-400 hover:text-slate-600 p-2 -mr-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M6 18L18 6M6 6h12v12" />
                    </svg>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="p-8 overflow-y-auto flex-1 prose-custom text-[15px] leading-relaxed text-slate-700" 
                 x-html="selectedService?.full_content">
            </div>
            
            <!-- Modal Footer -->
            <div class="px-8 py-5 border-t bg-white flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <button @click="showServiceModal = false; navigateTo('contact')" 
                            class="px-8 py-3 rounded-2xl bg-[#0f172a] text-white text-sm font-semibold flex-1 sm:flex-none" x-text="t('common.modal_contact_now')">
                    </button>
                    
                    <button @click="showServiceModal = false" 
                            class="px-6 py-3 rounded-2xl border text-sm font-medium" x-text="t('common.modal_close')">
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification (ĐÃ SỬA: vị trí cao hơn + transition đầy đủ + cú pháp HTML đúng) -->
    <div x-show="showToast" 
         class="fixed bottom-20 right-6 z-[200] bg-white border border-slate-200 shadow-xl rounded-2xl px-5 py-4 flex items-center gap-x-3 max-w-sm"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="text-emerald-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18" />
            </svg>
        </div>
        <div>
            <div class="font-semibold text-emerald-700" x-text="toastMessage"></div>
        </div>
    </div>

    <script>
        // Tailwind script configuration
        function initializeTailwind() {
            document.documentElement.style.setProperty('--accent-gold', '#d4af37');
            
            const style = document.createElement('style');
            style.innerHTML = `
                .prose-custom { font-size: 15px; line-height: 1.7; }
                .prose-custom h4 { margin-top: 1.25rem; margin-bottom: .5rem; }
                .prose-custom ul { padding-left: 1.25rem; }
                .prose-custom li { margin-bottom: .35rem; }
            `;
            document.head.append(style);
        }

        // Main Alpine Component
        function etaxApp() {
            return {
                // State
                currentLocale: 'en',
                currentPage: 'home',
                translations: {},
                translationsCache: {},
                languages: [
                    { code: 'en', name: 'English' },
                    { code: 'vi', name: 'Tiếng Việt'},
                    { code: 'zh', name: '中文' }
                ],
                
                // UI State
                mobileMenuOpen: false,
                showServiceModal: false,
                selectedService: null,
                showToast: false,
                toastMessage: '',
                headerScrolled: false,

                // News
                newsData: { facebookUrl: '', posts: [] },
                newsLoaded: false,
                newsLoading: false,
                selectedNewsSlug: null,
                headlines: [],
                headlinesLoaded: false,
                headlinesLoading: false,
                headlineFilter: 'all',
                
                // Initialize
                async init() {
                    initializeTailwind();
                    
                    // Load initial locale from URL or localStorage
                    this.detectLocaleFromURL();
                    
                    // Load translations for current locale
                    await this.loadTranslations(this.currentLocale);
                    
                    // Render initial page
                    this.renderCurrentPage();
                    if (this.currentPage === 'news') {
                        this.loadHeadlines();
                        this.loadNewsData();
                    }
                    
                    // Listen for browser back/forward
                    window.addEventListener('popstate', () => {
                        this.detectLocaleFromURL();
                        this.renderCurrentPage();
                        if (this.currentPage === 'news') {
                            this.loadHeadlines();
                            this.loadNewsData();
                        }
                    });

                    window.addEventListener('scroll', () => {
                        this.headerScrolled = window.scrollY > 16;
                    }, { passive: true });
                    
                    // Update document title & meta on init
                    this.updateSEO();
                    
                    // Keyboard escape for modal
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.showServiceModal) {
                            this.showServiceModal = false;
                        }
                    });
                    
                    console.log('%c[ETAX] Professional multilingual static website initialized successfully.', 'color:#64748b');
                },
                
                // Detect locale and page from URL path
                detectLocaleFromURL() {
                    const path = window.location.pathname;
                    const segments = path.split('/').filter(Boolean);
                    
                    let locale = 'en';           // ← Mặc định là English
                    let page = 'home';
                    let newsSlug = null;
                    
                    if (segments.length > 0) {
                        const first = segments[0];
                        
                        if (first === 'vi') {
                            locale = 'vi';
                            if (segments.length > 1) {
                                page = this.mapSlugToPage(segments[1]);
                                if (page === 'news' && segments.length > 2) {
                                    newsSlug = segments[2];
                                }
                            }
                        } else if (first === 'zh') {
                            locale = 'zh';
                            if (segments.length > 1) {
                                page = this.mapSlugToPage(segments[1]);
                                if (page === 'news' && segments.length > 2) {
                                    newsSlug = segments[2];
                                }
                            }
                        } else {
                            // Mọi trường hợp còn lại (không có prefix hoặc prefix lạ) → English
                            page = this.mapSlugToPage(first);
                            if (page === 'news' && segments.length > 1) {
                                newsSlug = segments[1];
                            }
                        }
                    }
                    
                    this.currentLocale = locale;
                    this.currentPage = page;
                    this.selectedNewsSlug = newsSlug;
                },
                
                mapSlugToPage(slug) {
                    const mapping = {
                        '': 'home',
                        'trang-chu': 'home',
                        'home': 'home',
                        'gioi-thieu': 'about',
                        'about': 'about',
                        'dich-vu': 'services',
                        'services': 'services',
                        'tin-tuc': 'news',
                        'news': 'news',
                        'tuyen-dung': 'careers',
                        'careers': 'careers',
                        'lien-he': 'contact',
                        'contact': 'contact'
                    };
                    return mapping[slug] || 'home';
                },
                
                // Get page slug for URL (Vietnamese preferred for this VN company)
                getPageSlug(page) {
                    const reverseMap = {
                        'home': '',
                        'about': 'about',
                        'services': 'services',
                        'news': 'news',
                        'careers': 'careers',
                        'contact': 'contact'
                    };
                    return reverseMap[page] || '';
                },
                
                // Update browser URL without reload (ĐÃ VIẾT LẠI - ỔN ĐỊNH HƠN)
                updateURL() {
                    const slug = this.getPageSlug(this.currentPage);
                    
                    // Xây dựng prefix theo ngôn ngữ (English = không có prefix)
                    let newPath = '/';
                    if (this.currentLocale === 'vi') {
                        newPath = '/vi/';
                    } else if (this.currentLocale === 'zh') {
                        newPath = '/zh/';
                    }
                    
                    if (slug) {
                        newPath += slug;
                    }
                    if (this.currentPage === 'news' && this.selectedNewsSlug) {
                        newPath = newPath.replace(/\/$/, '') + '/' + this.selectedNewsSlug;
                    }

                    // Giữ nguyên ngôn ngữ khi chuyển trang
                    if (window.location.pathname !== newPath) {
                        history.pushState({ locale: this.currentLocale }, '', newPath);
                    }
                },
                
                // Switch language
                async switchLanguage(newLocale) {
                    if (newLocale === this.currentLocale) return;
                    
                    this.currentLocale = newLocale;
                    
                    // Load new translations if needed
                    await this.loadTranslations(newLocale);
                    
                    // Update URL
                    this.updateURL();
                    
                    // Re-render current page with new language
                    this.renderCurrentPage();
                    this.updateSEO();

                    // Cuộn mượt về đầu trang khi chuyển ngôn ngữ
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },
                
                getCurrentFlag() {
                    const lang = this.languages.find(l => l.code === this.currentLocale);
                    return lang ? lang.flag : '🇻🇳';
                },
                
                getCurrentLangName() {
                    const lang = this.languages.find(l => l.code === this.currentLocale);
                    return lang ? lang.name.split(' ')[0] : 'Tiếng Việt';
                },
                
                // Translation helper
                t(key) {
                    if (!this.translations) return key;
                    
                    const keys = key.split('.');
                    let value = this.translations;
                    
                    for (const k of keys) {
                        if (value && typeof value === 'object' && k in value) {
                            value = value[k];
                        } else {
                            return key; // fallback
                        }
                    }
                    return value || key;
                },
                
                // Load translations (with cache)
                async loadTranslations(locale) {
                    if (this.translationsCache[locale]) {
                        this.translations = this.translationsCache[locale];
                        return;
                    }
                    
                    try {
                        const res = await fetch(`/messages/${locale}.json`);
                        if (!res.ok) throw new Error('Failed to load translations');
                        
                        const data = await res.json();
                        this.translationsCache[locale] = data;
                        this.translations = data;
                    } catch (error) {
                        console.error('Error loading translations:', error);
                        // Fallback to Vietnamese if error
                        if (locale !== 'vi') {
                            await this.loadTranslations('vi');
                        }
                    }
                },
                
                // Render current page
                renderCurrentPage() {
                    const container = document.getElementById('page-content');
                    if (!container) return;

                    let html = '';
                    
                    switch (this.currentPage) {
                        case 'home':
                            html = this.getHomeHTML();
                            break;
                        case 'about':
                            html = this.getAboutHTML();
                            break;
                        case 'services':
                            html = this.getServicesHTML();
                            break;
                        case 'news':
                            html = this.getNewsHTML();
                            break;
                        case 'careers':
                            html = this.getCareersHTML();
                            break;
                        case 'contact':
                            html = this.getContactHTML();
                            break;
                        default:
                            html = this.getHomeHTML();
                    }
                    
                    container.classList.remove('page-transition');
                    container.innerHTML = html;
                    void container.offsetWidth;
                    container.classList.add('page-transition');
                    
                    // Re-attach form listeners after rendering
                    this.attachFormListeners();
                    this.updateSEO();
                },
                
                attachFormListeners() {
                    // Contact form
                    const contactForm = document.getElementById('contact-form');
                    if (contactForm) {
                        contactForm.addEventListener('submit', (e) => {
                            e.preventDefault();
                            this.handleContactSubmit(e.target);
                        });
                    }
                    
                    // Careers form
                    const careersForm = document.getElementById('careers-form');
                    if (careersForm) {
                        careersForm.addEventListener('submit', (e) => {
                            e.preventDefault();
                            this.handleCareersSubmit(e.target);
                        });
                    }

                    // === ATTACH SERVICE MODAL CLICK (ĐÃ VIẾT LẠI - ỔN ĐỊNH HƠN) ===
                    this.attachServiceCardListeners();
                },

                attachServiceCardListeners() {
                    document.querySelectorAll('.services-interactive-grid').forEach((grid) => {
                        grid.onclick = null;
                        grid.addEventListener('click', (e) => {
                            const card = e.target.closest('.service-card');
                            if (card && card.dataset.serviceId) {
                                const serviceId = parseInt(card.dataset.serviceId);
                                this.openServiceModal(serviceId);
                            }
                        });
                    });
                },
                
                // Gửi form Contact qua Web3Forms (ĐÃ CẬP NHẬT: hỗ trợ đa ngôn ngữ + thông báo rõ ràng)
                async handleContactSubmit(form) {
                    const submitBtn = form.querySelector('button[type="submit"]');
                    const originalText = submitBtn.innerHTML;

                    // Đa ngôn ngữ cho nút đang gửi
                    const locale = this.currentLocale;
                    const sendingText = this.t('forms.sending');
                    
                    submitBtn.innerHTML = sendingText;
                    submitBtn.disabled = true;

                    try {
                        const formData = new FormData(form);
                        
                        const response = await fetch('https://api.web3forms.com/submit', {
                            method: 'POST',
                            body: formData
                        });

                        const result = await response.json();

                        if (result.success) {
                            this.showToastMessage(this.t('forms.contact_success'));
                            form.reset();
                        } else {
                            this.showToastMessage(this.t('forms.submit_failed_retry'));
                            console.error('Web3Forms Error:', result);
                        }
                    } catch (error) {
                        this.showToastMessage(this.t('forms.generic_error'));
                        console.error('Network Error:', error);
                    } finally {
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                },

                // Gửi form Careers (có file CV) qua Web3Forms (ĐÃ CẬP NHẬT: hỗ trợ đa ngôn ngữ + thông báo rõ ràng + debug tốt hơn)
                async handleCareersSubmit(form) {
                    const submitBtn = form.querySelector('button[type="submit"]');
                    const originalText = submitBtn.innerHTML;

                    // Đa ngôn ngữ cho nút đang gửi
                    const locale = this.currentLocale;
                    const sendingText = this.t('forms.sending');
                    
                    submitBtn.innerHTML = sendingText;
                    submitBtn.disabled = true;

                    // === KIỂM TRA KÍCH THƯỚC FILE CV TRƯỚC KHI GỬI (TỐI ĐA 8MB) ===
                    const fileInput = form.querySelector('input[type="file"][name="attachment"]');
                    if (fileInput && fileInput.files.length > 0) {
                        const file = fileInput.files[0];
                        const maxSize = 8 * 1024 * 1024; // 8MB

                        if (file.size > maxSize) {
                            this.showToastMessage(this.t('forms.file_too_large'));
                            submitBtn.innerHTML = originalText;
                            submitBtn.disabled = false;
                            return;
                        }
                    }

                    try {
                        const formData = new FormData(form);
                        
                        const response = await fetch('https://api.web3forms.com/submit', {
                            method: 'POST',
                            body: formData
                        });

                        const result = await response.json();

                        if (result.success) {
                            this.showToastMessage(this.t('forms.careers_success'));
                            form.reset();
                        } else {
                            // Hiển thị lỗi chi tiết hơn từ Web3Forms
                            let failMsg = this.t('forms.submit_failed_retry');
                            
                            if (result.message) {
                                failMsg = result.message;
                            }
                            
                            this.showToastMessage(failMsg);
                            
                            // Debug chi tiết hơn
                            console.error('Web3Forms Error (Status 400):', result);
                            console.log('Full response object:', JSON.stringify(result, null, 2));
                        }
                    } catch (error) {
                        this.showToastMessage(this.t('forms.generic_error'));
                        console.error('Network Error:', error);
                    } finally {
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                },
                
                showToastMessage(message) {
                    this.toastMessage = message;
                    this.showToast = true;
                    
                    setTimeout(() => {
                        this.showToast = false;
                    }, 4500);
                },
                
                // CẬP NHẬT SEO (title + meta description) theo ngôn ngữ hiện tại
                // ĐÃ THÊM: Hàm này bị thiếu trước đây → gây lỗi "this.updateSEO is not a function"
                updateSEO() {
                    try {
                        const meta = this.t('meta') || {};
                        let title = meta.title;
                        let description = meta.description;

                        if (title) {
                            document.title = title;
                        }
                        const descTag = document.querySelector('meta[name="description"]');
                        if (descTag && description) {
                            descTag.setAttribute('content', description);
                        }
                    } catch (e) {
                        console.warn('[ETAX] SEO update warning:', e);
                    }
                },

                async loadNewsData() {
                    if (this.newsLoading || this.newsLoaded) return;

                    this.newsLoading = true;
                    const endpoints = ['/api/news', '/data/news.json'];

                    try {
                        let loaded = false;

                        for (const endpoint of endpoints) {
                            try {
                                const res = await fetch(endpoint, { cache: 'no-store' });
                                if (!res.ok) continue;

                                const data = await res.json();
                                this.newsData = {
                                    facebookUrl: data.facebookUrl || 'https://www.facebook.com/ETAXHCMVN/',
                                    posts: Array.isArray(data.posts) ? data.posts : []
                                };
                                this.newsLoaded = true;
                                loaded = true;
                                break;
                            } catch (endpointError) {
                                console.warn(`[ETAX] News endpoint failed (${endpoint}):`, endpointError);
                            }
                        }

                        if (!loaded) {
                            throw new Error('Failed to load news');
                        }
                    } catch (error) {
                        console.warn('[ETAX] News load warning:', error);
                        if (!this.newsLoaded) {
                            this.newsData = { facebookUrl: 'https://www.facebook.com/ETAXHCMVN/', posts: [] };
                        }
                    } finally {
                        this.newsLoading = false;
                    }
                },

                getFacebookUrl() {
                    const url = (this.newsData && this.newsData.facebookUrl) || '';
                    return url.trim();
                },

                getNewsField(post, field) {
                    if (!post || !post[field]) return '';
                    const value = post[field];
                    if (typeof value === 'string') return value;
                    return value[this.currentLocale] || value.en || value.vi || '';
                },

                getNewsPost(slug) {
                    const posts = (this.newsData && this.newsData.posts) || [];
                    return posts.find(p => p.slug === slug);
                },

                formatNewsDate(dateStr) {
                    if (!dateStr) return '';
                    try {
                        const hasTime = /[T,:]/.test(dateStr) && !/^\d{4}-\d{2}-\d{2}$/.test(dateStr);
                        const date = hasTime ? new Date(dateStr) : new Date(dateStr + 'T00:00:00');
                        if (Number.isNaN(date.getTime())) return '';
                        const localeMap = { vi: 'vi-VN', en: 'en-US', zh: 'zh-CN' };
                        return date.toLocaleDateString(localeMap[this.currentLocale] || 'en-US', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        });
                    } catch (e) {
                        return dateStr;
                    }
                },

                escapeHtml(text) {
                    if (!text) return '';
                    const div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                },

                async loadHeadlines() {
                    if (this.headlinesLoading || this.headlinesLoaded) return;
                    this.headlinesLoading = true;

                    try {
                        const res = await fetch('/api/headlines');
                        if (!res.ok) throw new Error('Failed to load headlines');
                        const data = await res.json();
                        this.headlines = Array.isArray(data.items) ? data.items : [];
                        this.headlinesLoaded = true;
                    } catch (error) {
                        console.warn('[ETAX] Headlines load warning:', error);
                        this.headlines = [];
                        this.headlinesLoaded = true;
                    } finally {
                        this.headlinesLoading = false;
                        if (this.currentPage === 'news' && !this.selectedNewsSlug) {
                            this.renderCurrentPage();
                        }
                    }
                },

                setHeadlineFilter(lang) {
                    this.headlineFilter = lang;
                    if (this.currentPage === 'news') {
                        this.renderCurrentPage();
                    }
                },

                openNewsPost(slug) {
                    this.selectedNewsSlug = slug;
                    this.currentPage = 'news';
                    this.updateURL();
                    this.renderCurrentPage();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                backToNewsList() {
                    this.selectedNewsSlug = null;
                    this.currentPage = 'news';
                    this.updateURL();
                    this.renderCurrentPage();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },
                
                // Navigate to page
                async navigateTo(page) {
                    this.currentPage = page;
                    this.updateURL();
                    this.renderCurrentPage();
                    this.updateSEO();
                    
                    // Close mobile menu if open
                    this.mobileMenuOpen = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    if (page === 'news') {
                        this.loadHeadlines();
                        this.loadNewsData();
                    }
                },
                
                // Mở modal chi tiết dịch vụ (ĐÃ VIẾT LẠI - ỔN ĐỊNH HƠN)
                openServiceModal(serviceId) {
                    const services = this.t('services.list') || [];
                    // Tìm service (hỗ trợ cả string và number)
                    const service = services.find(s => s.id == serviceId);
                    
                    if (service) {
                        this.selectedService = service;
                        this.showServiceModal = true;
                    } else {
                        console.warn('Service not found with id:', serviceId);
                    }
                },
                
                heroAssetVersion: '4',

                getPageHeroHTML(badge, title, subtitle, image = '/assets/bason-bridge.jpg', position = 'center 35%') {
                    const assetUrl = image.includes('?') ? image : `${image}?v=${this.heroAssetVersion}`;
                    return `
                        <div class="page-hero relative text-white overflow-hidden bg-cover bg-center"
                             style="background-image: linear-gradient(90deg, rgba(15,23,42,.94) 0%, rgba(15,23,42,.82) 42%, rgba(15,23,42,.45) 100%), url('${assetUrl}'); min-height: 360px; background-position: ${position}; background-size: cover;">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/45 via-transparent to-transparent pointer-events-none"></div>
                            <div class="relative max-w-7xl mx-auto px-6 lg:px-10 py-14 sm:py-16">
                                <div class="max-w-3xl">
                                    <div class="inline-flex items-center px-3.5 py-1 rounded-full bg-white/10 text-[11px] font-semibold tracking-[2px] mb-4">${badge}</div>
                                    <h1 class="text-3xl sm:text-4xl lg:text-[2.75rem] font-semibold tracking-tight leading-tight">${title}</h1>
                                    <p class="mt-4 text-base sm:text-lg text-slate-200 leading-relaxed max-w-2xl">${subtitle}</p>
                                </div>
                            </div>
                        </div>
                    `;
                },

                // Get Home page HTML
                getHomeHTML() {
                    const whyItems = this.t('home.why_items') || [];
                    const stats = this.t('home.stats') || [];
                    const credentials = this.t('home.credentials') || [];
                    const previewServices = (this.t('services.list') || []).slice(0, 4);
                    const previewIcons = [
                        '<path d="M4 19V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14M8 7h8M8 11h3M15 11h1M8 15h3M15 15h1M3 21h18"/>',
                        '<path d="M12 3v18M5 8h14M5 16h14M7 12h10"/>',
                        '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2"/>',

            if (window.Alpine && typeof Alpine.$data === 'function') {
                const data = Alpine.$data(alpineEl);
                if (data) return data;
            }
            if (alpineEl._x_dataStack && alpineEl._x_dataStack[0]) return alpineEl._x_dataStack[0];
            if (alpineEl.__x && alpineEl.__x.$data) return alpineEl.__x.$data;
            return null;
        }

        window.openNewsPost = function(slug) {
            const app = getEtaxApp();
            if (app && typeof app.openNewsPost === 'function') app.openNewsPost(slug);
        };

        window.backToNewsList = function() {
            const app = getEtaxApp();
            if (app && typeof app.backToNewsList === 'function') app.backToNewsList();
        };

        window.setHeadlineFilter = function(lang) {
            const app = getEtaxApp();
            if (app && typeof app.setHeadlineFilter === 'function') app.setHeadlineFilter(lang);
        };

        // Global navigate helper (ĐÃ VIẾT LẠI - ĐƠN GIẢN VÀ ỔN ĐỊNH HƠN)
        window.goTo = function(page) {
            const alpineEl = document.querySelector('[x-data]');
            if (alpineEl && alpineEl.__x && alpineEl.__x.$data && typeof alpineEl.__x.$data.navigateTo === 'function') {
                alpineEl.__x.$data.navigateTo(page);
            } else {
                // Fallback mới - phù hợp với cấu trúc English làm mặc định
                const path = window.location.pathname;
                let locale = 'en';
                
                if (path.startsWith('/vi')) {
                    locale = 'vi';
                } else if (path.startsWith('/zh')) {
                    locale = 'zh';
                }

                let url = '/';
                
                if (locale === 'vi') {
                    url = '/vi/';
                } else if (locale === 'zh') {
                    url = '/zh/';
                }

                if (page === 'services') {
                    url += 'services';
                } else if (page === 'contact') {
                    url += 'contact';
                } else if (page === 'about') {
                    url += 'about';
                } else if (page === 'careers') {
                    url += 'careers';
                }
                // home thì để url = '/' hoặc '/vi/' hoặc '/zh/'

                window.location.href = url;
            }
        };

// Global helper mở modal dịch vụ (ĐÃ CẢI THIỆN)
        window.openServiceModal = function(serviceId) {
            const alpineEl = document.querySelector('[x-data]');
            if (alpineEl && alpineEl.__x && alpineEl.__x.$data) {
                const data = alpineEl.__x.$data;
                if (typeof data.openServiceModal === 'function') {
                    data.openServiceModal(parseInt(serviceId));
                } else {
                    console.warn('openServiceModal method not found');
                }
            } else {
                console.warn('Alpine instance not found');
            }
        };

        // Boot the application
        document.addEventListener('alpine:init', () => {
            // Alpine is ready
        });
        
        // Start everything when DOM is ready
        window.onload = function() {
            console.log('%c[ETAX HCM] Static multilingual website ready for Cloudflare Pages.', 'color:#64748b; font-size:9px');
        }
    </script>
</body>
</html>
